name: Integrate
on:
  workflow_dispatch:
    inputs:
      prs:
        description: Space-separated PR numbers in queue order
        type: string
        required: true
permissions:
  contents: write
  actions: write
  pull-requests: read
concurrency: integrate
jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: integration/${{ github.run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
      - name: Merge queued PRs
        env:
          PRS: ${{ inputs.prs }}
        run: |
          read -r -a prs <<< "$PRS"
          if [[ ${#prs[@]} == 0 ]]; then
            echo '::error::Provide at least one PR number.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          echo "BASE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          for pr in "${prs[@]}"; do
            if [[ ! "$pr" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::Invalid PR number: $pr"
              exit 1
            fi
            if [[ $(gh pr view "$pr" --json state,baseRefName --jq '.state == "OPEN" and .baseRefName == "main"') != true ]]; then
              echo "::error::PR #$pr must be OPEN and target main."
              exit 1
            fi
            git fetch origin "refs/pull/$pr/head"
            if ! git merge --no-ff --no-edit FETCH_HEAD; then
              echo "::error::Failed to merge PR #$pr. Resolve merge conflicts before retrying."
              exit 1
            fi
          done
      - name: Push integration branch
        run: git push origin "HEAD:$BRANCH"
      - name: Dispatch and watch full verification
        run: |
          sha=$(git rev-parse HEAD)
          gh workflow run ci.yml --ref "$BRANCH" -f full=true
          gh workflow run alpine.yml --ref "$BRANCH"
          gh workflow run nix.yml --ref "$BRANCH"
          runs=()
          for workflow in ci.yml alpine.yml nix.yml; do
            id=''
            for attempt in {1..30}; do
              id=$(gh run list --workflow "$workflow" --branch "$BRANCH" --event workflow_dispatch \
                --json databaseId,headSha --jq "first(.[] | select(.headSha == \"$sha\") | .databaseId)")
              [[ -n "$id" ]] && break
              sleep 2
            done
            if [[ -z "$id" ]]; then
              echo "::error::No $workflow dispatch run found for $BRANCH at $sha."
              exit 1
            fi
            runs+=("$id")
          done
          status=0
          for id in "${runs[@]}"; do
            gh run watch "$id" --exit-status || status=1
          done
          exit "$status"
      - name: Fast-forward main
        run: |
          if ! git push origin HEAD:main; then
            echo '::error::Cannot fast-forward main. Main may have moved, or branch protection rejected the push.'
            exit 1
          fi
      - name: Deploy changed website
        run: |
          if ! git diff --quiet "$BASE" HEAD -- site .github/workflows/pages.yml; then
            gh workflow run pages.yml --ref main
          fi
      - name: Delete integration branch
        if: ${{ always() }}
        run: |
          ref=$(git ls-remote origin "refs/heads/$BRANCH")
          if [[ -n "$ref" ]]; then
            git push origin --delete "$BRANCH"
          fi
