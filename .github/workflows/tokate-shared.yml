name: Tokate coordination
on:
  workflow_call:
permissions: {}
jobs:
  coordinate:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request == null &&
      startsWith(github.event.comment.body, '/tokate ')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: tokate-coordinate-${{ github.event.issue.number }}
      cancel-in-progress: false
      queue: max
    permissions:
      actions: read
      contents: write
      issues: read
      pull-requests: write
    steps:
      - &namespace
        name: Permit command namespace
        run: |
          sudo tee /etc/apparmor.d/tokate-unshare <<'EOF'
          abi <abi/4.0>,
          profile unshare /usr/bin/unshare flags=(unconfined) {
            userns,
          }
          EOF
          sudo apparmor_parser -r /etc/apparmor.d/tokate-unshare
          /usr/bin/unshare --map-current-user --pid --fork --kill-child --mount-proc -- /bin/true
      - &bootstrap
        name: Fetch coordinator release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq '[.referenced_workflows[] | select(.path | startswith("obselate/tokate/.github/workflows/tokate-shared.yml@"))] | if length == 1 then .[0].sha else error("Missing unique Tokate workflow ref") end')
          printf '%s\n' "$sha" | grep -Eq '^[0-9a-f]{40}$'
          version=$(gh api -H 'Accept: application/vnd.github.raw+json' "repos/obselate/tokate/contents/VERSION?ref=$sha")
          printf '%s\n' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
          test "$(gh api "repos/obselate/tokate/commits/v$version" --jq .sha)" = "$sha"
          gh api "repos/obselate/tokate/releases/tags/v$version" > "$RUNNER_TEMP/tokate-release.json"
          jq -e --arg tag "v$version" '.tag_name == $tag and .draft == false and .prerelease == false' "$RUNNER_TEMP/tokate-release.json"
          bundle="tokate-$version-linux-x64"
          archive=$(jq -er --arg name "$bundle.tar.gz" '[.assets[] | select(.name == $name and .state == "uploaded" and .size > 0 and .size <= 134217728)] | if length == 1 then .[0].id else error("Missing unique archive") end' "$RUNNER_TEMP/tokate-release.json")
          checksum=$(jq -er --arg name "$bundle.tar.gz.sha256" '[.assets[] | select(.name == $name and .state == "uploaded" and .size > 0 and .size <= 256)] | if length == 1 then .[0].id else error("Missing unique checksum") end' "$RUNNER_TEMP/tokate-release.json")
          case "$archive:$checksum" in *[!0-9:]*) exit 1;; esac
          curl -qfsSL --proto '=https' --proto-redir '=https' --max-time 60 --max-filesize 134217728 -H 'Accept: application/octet-stream' -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/obselate/tokate/releases/assets/$archive" -o "$RUNNER_TEMP/$bundle.tar.gz"
          curl -qfsSL --proto '=https' --proto-redir '=https' --max-time 60 --max-filesize 256 -H 'Accept: application/octet-stream' -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/obselate/tokate/releases/assets/$checksum" -o "$RUNNER_TEMP/tokate.sha256"
          test "$(wc -l < "$RUNNER_TEMP/tokate.sha256")" -eq 1
          grep -Eq "^[0-9a-f]{64}  tokate-$version-linux-x64\.tar\.gz$" "$RUNNER_TEMP/tokate.sha256"
          (cd "$RUNNER_TEMP" && sha256sum -c tokate.sha256)
          tar -xOzf "$RUNNER_TEMP/$bundle.tar.gz" "$bundle/tokate" > "$RUNNER_TEMP/tokate"
          chmod 755 "$RUNNER_TEMP/tokate"
      - name: Coordinate bounded GitHub request
        env:
          GH_TOKEN: ${{ github.token }}
          TOKATE_REPOSITORY: ${{ github.repository }}
        run: '"$RUNNER_TEMP/tokate" coordinate "$TOKATE_REPOSITORY" --event "$GITHUB_EVENT_PATH" --traffic'
  approve-label:
    if: github.event_name == 'issues' && github.event.label.name == 'tokate:approved' && github.event.issue.pull_request == null
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: tokate-coordinate-${{ github.event.issue.number }}
      cancel-in-progress: false
      queue: max
    permissions:
      actions: read
      contents: write
      issues: write
    steps:
      - *namespace
      - *bootstrap
      - name: Coordinate bounded GitHub request
        env:
          GH_TOKEN: ${{ github.token }}
          TOKATE_REPOSITORY: ${{ github.repository }}
        run: '"$RUNNER_TEMP/tokate" coordinate "$TOKATE_REPOSITORY" --event "$GITHUB_EVENT_PATH" --traffic'
  admit:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: tokate-admission-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: write
    steps:
      - *namespace
      - *bootstrap
      - name: Admit canonical pull request
        env:
          GH_TOKEN: ${{ github.token }}
          TOKATE_REPOSITORY: ${{ github.repository }}
        run: '"$RUNNER_TEMP/tokate" admit "$TOKATE_REPOSITORY" --event "$GITHUB_EVENT_PATH" --traffic'
