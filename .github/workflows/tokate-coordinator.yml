name: Tokate
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review, converted_to_draft, labeled, unlabeled, assigned, unassigned]
permissions: {}
jobs:
  coordinate:
    concurrency:
      group: tokate-requests-${{ github.event.issue.number || github.run_id }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
      issues: read
      pull-requests: write
    uses: obselate/tokate/.github/workflows/tokate-shared.yml@962da857fee7e9ff5e867c9077d5b88513fd9cfe
    with:
      archive_url: 'https://api.github.com/repos/obselate/tokate/releases/assets/627165868'
      archive_sha256: '5c9c9a3d21c182cec737dbde6a53df294da61696550a0c182dbe01b11aa2e74f'
      member: 'tokate-0.3.14-linux-x64/tokate'
