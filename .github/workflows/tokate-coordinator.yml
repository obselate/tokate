name: Tokate
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review, converted_to_draft, labeled, unlabeled, assigned, unassigned]
permissions: {}
jobs:
  coordinate:
    concurrency:
      group: tokate-requests-${{ github.event.issue.number || github.run_id }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
      issues: read
      pull-requests: write
    uses: obselate/tokate/.github/workflows/tokate-shared.yml@a2d0882b8dd203b97703e1b4815a8f2f83039d49
    with:
      archive_url: 'https://api.github.com/repos/obselate/tokate/releases/assets/633375251'
      archive_sha256: '84d58f9d478f438f041a5084774c5cb70637c0287b90f043023bdf75132d453f'
      member: 'tokate-0.4.5-linux-x64/tokate'
