name: Tokate
on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review, converted_to_draft, labeled, unlabeled, assigned, unassigned]
permissions: {}
jobs:
  coordinate:
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write
    uses: obselate/tokate/.github/workflows/tokate-shared.yml@v0
