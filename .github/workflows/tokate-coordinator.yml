name: Tokate
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review, converted_to_draft, labeled, unlabeled, assigned, unassigned]
permissions: {}
jobs:
  coordinate:
    concurrency:
      group: tokate-requests-${{ github.event.issue.number || github.run_id }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
      issues: read
      pull-requests: write
    uses: obselate/tokate/.github/workflows/tokate-shared.yml@1cdf63373450803eeca38e47235e27b1e4075816
    with:
      archive_url: 'https://api.github.com/repos/obselate/tokate/releases/assets/634154250'
      archive_sha256: '9df57055042d7319dedb814d809df4fac0ba739b065a0110ce4e1cc78f8722dc'
      member: 'tokate-0.4.7-linux-x64/tokate'
