name: Tokate
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review, converted_to_draft, labeled, unlabeled, assigned, unassigned]
permissions: {}
jobs:
  coordinate:
    concurrency:
      group: tokate-requests-${{ github.event.issue.number || github.run_id }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
      issues: read
      pull-requests: write
    uses: obselate/tokate/.github/workflows/tokate-shared.yml@d3b8d2ed3535e1d212715209781a00a88f408eda
    with:
      archive_url: 'https://api.github.com/repos/obselate/tokate/releases/assets/632324550'
      archive_sha256: '03f1618bb9553c72104a75239689a581cae0d094c9e962da419eb7185debc0ed'
      member: 'tokate-0.4.2-linux-x64/tokate'
