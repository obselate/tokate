name: Tokate
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review, converted_to_draft, labeled, unlabeled, assigned, unassigned]
permissions: {}
jobs:
  coordinate:
    concurrency:
      group: tokate-requests-${{ github.event.issue.number || github.run_id }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
      issues: read
      pull-requests: write
    uses: obselate/tokate/.github/workflows/tokate-shared.yml@568a15275269034f1e0ea436df5a51c0c23ca583
    with:
      archive_url: 'https://api.github.com/repos/obselate/tokate/releases/assets/634721666'
      archive_sha256: '5ea51b6b0ea027d9cc2683a9cb9e200d96f7e05c330920d6ea33f58082f1389e'
      member: 'tokate-0.4.8-linux-x64/tokate'
