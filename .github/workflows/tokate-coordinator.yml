name: Tokate
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review, converted_to_draft, labeled, unlabeled, assigned, unassigned]
permissions: {}
jobs:
  coordinate:
    concurrency:
      group: tokate-requests-${{ github.event.issue.number || github.run_id }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
      issues: read
      pull-requests: write
    uses: obselate/tokate/.github/workflows/tokate-shared.yml@40a24cbf73b8065e1ec4317ca494361db0f3533b
    with:
      archive_url: 'https://api.github.com/repos/obselate/tokate/releases/assets/633902785'
      archive_sha256: '8e2ec4bfb6948e6798a3d1011dea6fd05bb9c223f8b53d774444f1478039d329'
      member: 'tokate-0.4.6-linux-x64/tokate'
