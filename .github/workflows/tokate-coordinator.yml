name: Tokate
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review, converted_to_draft, labeled, unlabeled, assigned, unassigned]
permissions: {}
jobs:
  coordinate:
    concurrency:
      group: tokate-requests-${{ github.event.issue.number || github.run_id }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
      issues: read
      pull-requests: write
    uses: obselate/tokate/.github/workflows/tokate-shared.yml@5bd1563bc313ccda147ce3ed0b828d5c9aff1a8e
    with:
      archive_url: 'https://api.github.com/repos/obselate/tokate/releases/assets/630092736'
      archive_sha256: '76de55e888fbb5ddf2a04744f803f90a93a6ee53558afc3f3b44d625ec305183'
      member: 'tokate-0.4.0-linux-x64/tokate'
