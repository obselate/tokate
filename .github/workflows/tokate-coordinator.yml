name: Tokate
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review, converted_to_draft, labeled, unlabeled, assigned, unassigned]
permissions: {}
jobs:
  coordinate:
    concurrency:
      group: tokate-requests-${{ github.event.issue.number || github.run_id }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
      issues: read
      pull-requests: write
    uses: obselate/tokate/.github/workflows/tokate-shared.yml@c5fb3925199db84e5dd2ea1119656014acd11f30
    with:
      archive_url: 'https://api.github.com/repos/obselate/tokate/releases/assets/632605098'
      archive_sha256: '09eec1eaccc51a6cb2b40313a90522aed0c221b4dd5a7a520c140023c9d8e914'
      member: 'tokate-0.4.4-linux-x64/tokate'
