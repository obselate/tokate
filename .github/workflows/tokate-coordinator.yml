name: Tokate
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review, converted_to_draft, labeled, unlabeled, assigned, unassigned]
permissions: {}
jobs:
  coordinate:
    concurrency:
      group: tokate-requests-${{ github.event.issue.number || github.run_id }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
      issues: read
      pull-requests: write
    uses: obselate/tokate/.github/workflows/tokate-shared.yml@ba87d5b6b6bab8045d7171960bc9ad02cbc79340
    with:
      archive_url: 'https://api.github.com/repos/obselate/tokate/releases/assets/629109019'
      archive_sha256: '80bd83aeef6b36c32ac49c9c145644f68d686970f9f1acb17416fa1544c86f04'
      member: 'tokate-0.3.15-linux-x64/tokate'
