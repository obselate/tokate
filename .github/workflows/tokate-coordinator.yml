name: Tokate
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review, converted_to_draft, labeled, unlabeled, assigned, unassigned]
permissions: {}
jobs:
  coordinate:
    concurrency:
      group: tokate-requests-${{ github.event.issue.number || github.run_id }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
      issues: read
      pull-requests: write
    uses: obselate/tokate/.github/workflows/tokate-shared.yml@6adf8d22277f16f80726c28ed5c757b2ef189cdd
    with:
      archive_url: 'https://api.github.com/repos/obselate/tokate/releases/assets/632208342'
      archive_sha256: '192ec0fd6b191e8686a62f3ebb72ec864a7d79ed0c2d4d46d7920143be07fe16'
      member: 'tokate-0.4.1-linux-x64/tokate'
