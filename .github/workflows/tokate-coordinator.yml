name: Tokate
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review, converted_to_draft, labeled, unlabeled, assigned, unassigned]
permissions: {}
jobs:
  coordinate:
    concurrency:
      group: tokate-requests-${{ github.event.issue.number || github.run_id }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
      issues: read
      pull-requests: write
    uses: obselate/tokate/.github/workflows/tokate-shared.yml@6942c7f941ebdb4091bf5def00c01cdb9b659cb7
    with:
      archive_url: 'https://api.github.com/repos/obselate/tokate/releases/assets/625964430'
      archive_sha256: '411a3854e60a4274287cf585b35c0ea5f3c31f684a085d9b3caf1f5d47fb3926'
      member: 'tokate-0.3.13-linux-x64/tokate'
